[project]
name = "finsight"
version = "0.1.0"
description = "FinSight: an agentic portfolio analyst built with LangGraph multi-agent orchestration, MCP tools, and cited RAG."
readme = "README.md"
authors = [
    { name = "Viresh Kumar", email = "vireshkumar7792@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "httpx>=0.28.1",
    "langchain>=1.5.2",
    "langchain-core>=1.8.4",
    "langchain-groq>=1.2.1",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.8.5",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "langsmith>=0.16.2",
    "lxml>=6.1.3",
    "mcp>=1.30.0",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "pydantic>=2",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.3.0",
    "streamlit>=1.67.0",
    "tavily-python>=0.8.5",
    "yfinance>=1.8.0",
]

[project.scripts]
finsight = "finsight.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not network and not llm'"
markers = [
    "network: hits the internet; deselected by default (run with: uv run pytest -m network)",
    "llm: calls a real LLM API (costs tokens); deselected by default (run with: uv run pytest -m llm)",
]
